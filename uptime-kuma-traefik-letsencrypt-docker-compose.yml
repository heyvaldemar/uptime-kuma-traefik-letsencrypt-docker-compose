# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259}}
  uptime-kuma: &uptime-kuma-image ${UPTIME_KUMA_IMAGE_TAG:-louislam/uptime-kuma:${UPTIME_KUMA_IMAGE_VERSION:-2.5.3@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c}}
  backups: &backups-image ${UPTIME_KUMA_BACKUPS_IMAGE_TAG:-alpine:${UPTIME_KUMA_BACKUPS_IMAGE_VERSION:-3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce}}

networks:
  uptime-kuma-network:
    external: true
  traefik-network:
    external: true

volumes:
  uptime-kuma-data:
  uptime-kuma-data-backups:
  traefik-certificates:

services:
  uptime-kuma:
    image: *uptime-kuma-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Everything this service knows is one SQLite file: the monitors somebody
    # clicked in by hand, the notification channels, the status pages, the 2FA
    # secrets. Docker's default is ten seconds to SIGKILL, and a kill during a
    # checkpoint leaves a write-ahead log to replay at best and a torn page at
    # worst. Sixty seconds, overridable in .env.
    stop_grace_period: ${UPTIME_KUMA_STOP_GRACE_PERIOD:-60s}
    # Resource limits as .env-overridable defaults (e.g. UPTIME_KUMA_MEMORY_LIMIT=1g);
    # the override survives every git pull. A few hundred monitors fit in the
    # default; each one is a scheduled job and a row per heartbeat.
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEMORY_LIMIT:-512m}
          cpus: "${UPTIME_KUMA_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${UPTIME_KUMA_MEMORY_RESERVATION:-128m}
          cpus: "${UPTIME_KUMA_CPU_RESERVATION:-0.25}"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      TZ: ${UPTIME_KUMA_TZ:-Etc/UTC}
      # Uptime Kuma is a monitoring dashboard, and a monitoring dashboard is a
      # map of the infrastructure it watches. Behind Traefik it is reachable by
      # anyone who knows the hostname until the first account exists.
      UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: ${UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN:-false}
    networks:
      - uptime-kuma-network
      - traefik-network
    healthcheck:
      # The image ships its own probe and its own schedule; this only shortens
      # the interval so `depends_on` and the deploy job do not wait a minute
      # for a container that is already answering.
      test: ["CMD", "extra/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.uptime-kuma.rule=Host(`${UPTIME_KUMA_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.uptime-kuma.service=uptime-kuma"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      # Enable TLS on this router
      - "traefik.http.routers.uptime-kuma.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.uptime-kuma.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.uptime-kuma.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    # A plain alpine: everything worth keeping here is one directory, so the
    # loop needs tar and nothing else. No database client, no bash - the
    # archive is written by a single process, so there is no pipeline whose
    # failure could be swallowed.
    image: *backups-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this container needs to
    # write archives it owns.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults; the override survives every
    # git pull.
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_BACKUPS_MEMORY_LIMIT:-128m}
          cpus: "${UPTIME_KUMA_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${UPTIME_KUMA_BACKUPS_MEMORY_RESERVATION:-16m}
          cpus: "${UPTIME_KUMA_BACKUPS_CPU_RESERVATION:-0.1}"
    command: >-
      sh -c 'sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # Written to .partial and renamed only on success, so a cycle killed
        # half way leaves no file that looks like a backup and is not one.
        #
        # The exit code alone cannot decide that here. GNU tar reserves 1 for
        # "a file changed while I read it" and 2 for a real failure, but this
        # is BusyBox tar, which returns 1 for both - including for the
        # is-a-directory case, where nothing was written at all.
        # Trusting the code would rename an empty file into place and call it
        # a backup. So the archive has to read back before it is renamed:
        # true on either tar, and a stronger promise than the code was.
        tar -zcpf "$$DATA_FILE.partial" $$DATA_PATH; RC=$$?;
        if { [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; } && tar -tzf "$$DATA_FILE.partial" > /dev/null 2>&1; then
          mv "$$DATA_FILE.partial" "$$DATA_FILE";
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE.partial" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - uptime-kuma-data:${DATA_PATH:-/app/data}
      - uptime-kuma-data-backups:${DATA_BACKUPS_PATH:-/srv/uptime-kuma-data/backups}
    environment:
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/uptime-kuma-data/backups}
      DATA_PATH: ${DATA_PATH:-/app/data}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-uptime-kuma-data-backup}
    networks:
      - uptime-kuma-network
    restart: unless-stopped
